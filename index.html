<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Invila.asia | Water Transformation & Infrastructure</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-blue: #2563eb;
            --white: #ffffff;
            --border-color: #dbe6f0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--white);
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0;
            scroll-behavior: smooth;
        }

        /* --- TYPOGRAPHY --- */
        .hero-title {
            font-weight: 800;
            line-height: 1.1 !important;
            letter-spacing: -0.04em !important;
            color: #1e293b;
            max-width: 300px; 
        }

        .highlight-blue {
            color: #3b82f6;
            font-style: italic;
        }

        /* --- LOGO STRIP GRID 3x3 --- */
        .logo-wrap {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            @apply mt-10;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .logo-pill {
            @apply flex items-center justify-center bg-white border border-slate-50 rounded-xl p-2 h-[80px];
        }

        .logo-pill img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
        }

        /* --- SLOGAN OVERLAY --- */
        #slogan-overlay {
            display: none; /* Sembunyi awal */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 40; /* Di bawah navbar (z-50) tapi di atas konten lain */
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        #slogan-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Proporsional di Android & iPhone */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- MOBILE ADJUSTMENTS --- */
        @media (max-width: 768px) {
            .hero-container {
                padding-top: 70px !important;
            }
            .hero-title {
                font-size: 38px !important;
            }
        }

        @media (min-width: 769px) {
            .hero-title {
                max-width: 600px;
                font-size: 56px !important;
            }
        }
    </style>
</head>
<body class="bg-white">

    <!-- NAVIGASI (Tetap Terlihat z-50) -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- TRIGGER: Klik teks ini untuk memunculkan slogan -->
            <div onclick="toggleSlogan(true)" class="text-[18px] font-bold tracking-tighter text-blue-600 uppercase cursor-pointer hover:opacity-70 transition-opacity">
                INVILA<span class="text-slate-300">.ASIA</span>
            </div>
            <div class="hidden md:flex space-x-6 text-sm font-semibold text-slate-600">
                <a href="#" class="hover:text-blue-600">Solutions</a>
                <a href="#" class="hover:text-blue-600">Company</a>
            </div>
        </div>
    </nav>

    <!-- SLOGAN OVERLAY (Full Halaman di bawah Nav) -->
    <div id="slogan-overlay" onclick="toggleSlogan(false)">
        <img src="slogan.png" alt="Slogan Invila">
    </div>

    <!-- MAIN CONTENT -->
    <section class="hero-container relative flex flex-col px-6 pb-12 overflow-hidden pt-28">
        <div class="max-w-7xl mx-auto w-full">
            
            <div class="grid lg:grid-cols-12 gap-6 items-start mb-6">
                <div class="lg:col-span-7">
                    <h1 class="hero-title">
                        Mengubah Air Limbah Menjadi <span class="highlight-blue">Nilai Strategis</span>
                    </h1>
                    
                    <p class="text-[16px] md:text-xl text-slate-500 mb-8 mt-6 leading-relaxed max-w-md">
                        Air limbah menyimpan <span class="italic font-medium text-slate-700">untapped value</span> yang luar biasa. Melalui solusi <span class="font-semibold text-blue-600 underline underline-offset-4 decoration-blue-100">zero-CapEx</span> Invila™.
                    </p>
                </div>

                <div class="lg:col-span-5">
                    <div class="overflow-hidden aspect-video bg-slate-900 relative shadow-2xl rounded-[24px] border-[3px] border-white">
                        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover">
                            <source src="kiw-industrial-project-video.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </div>

            <div class="logo-wrap">
                <div class="mb-5">
                    <span class="text-[11px] font-bold text-slate-800 tracking-tight">Dipercaya Industri & Mitra Strategis</span>
                </div>

                <div class="logo-grid">
                    <div class="logo-pill"><img src="cemerlang-samudra-kontrindo.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="kievit.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="kiw.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="patria-maritim-perkasa.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="united-tractors.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="petrokimia-gresik.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="tirta-asasta-depok.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="tirtanadi.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="wika.png" alt="Logo"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function toggleSlogan(show) {
            const overlay = document.getElementById('slogan-overlay');
            if (show) {
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Matikan scroll background
                // Push state ke history agar tombol Back bisa menutup overlay
                window.history.pushState({sloganOpen: true}, "");
            } else {
                overlay.style.display = 'none';
                document.body.style.overflow = 'auto'; // Aktifkan scroll
            }
        }

        // Handle Tombol ESCAPE
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                toggleSlogan(false);
            }
        });

        // Handle Tombol BACK di Browser/Android
        window.onpopstate = function(event) {
            toggleSlogan(false);
        };
    </script>

</body>
</html>
