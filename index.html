<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Invila.asia | Water Transformation & Infrastructure</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-blue: #0b5cab;
            --white: #ffffff;
            --border-color: #dbe6f0;
            --shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--white);
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        /* Navigasi Action Button */
        .btn-audit {
            @apply bg-[#00e5ff] text-[#003366] px-5 py-2 rounded-lg font-bold text-[11px] uppercase tracking-wider transition-all border border-[#00e5ff];
        }

        /* --- LOGO STRIP STYLING --- */
        .logo-wrap {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            @apply mt-8 md:mt-16;
        }

        .section-label {
            display: inline-block;
            @apply text-[9px] font-bold text-[#0b5cab] uppercase tracking-wider bg-blue-50 px-3 py-1.5 rounded-full mb-5;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
        }

        .logo-pill {
            height: 70px;
            @apply flex items-center justify-center bg-white border border-slate-100 rounded-xl p-2;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-pill img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
        }

        .holding-pair {
            @apply bg-blue-50/50 border-blue-100;
        }

        /* --- MOBILE SPECIFIC (iPhone & Android) --- */
        @media (max-width: 768px) {
            /* Mendekatkan jarak Nav ke Judul */
            .hero-container {
                padding-top: 85px !important;
            }
            /* Memaksa Judul menjadi 2 baris profesional */
            .hero-title {
                font-size: 34px !important;
                line-height: 1.15 !important;
                letter-spacing: -0.02em !important;
                margin-bottom: 20px !important;
            }
            .logo-grid { grid-template-columns: repeat(3, 1fr); }
            .logo-pill { height: 80px; }
        }

        @media (max-width: 480px) {
            .logo-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-title { font-size: 30px !important; }
        }
    </style>
</head>
<body class="bg-white">

    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b border-slate-50">
        <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
            <div class="text-lg font-bold tracking-tighter text-blue-600 uppercase">
                INVILA<span class="text-slate-300">.ASIA</span>
            </div>
            <div class="hidden md:flex space-x-6 text-[12px] font-bold uppercase tracking-widest items-center text-slate-600">
                <a href="#audit-kalkulator" class="btn-audit">Audit Simulasi</a>
            </div>
        </div>
    </nav>

    <section class="hero-container relative min-h-screen flex flex-col px-5 pb-12 overflow-hidden pt-32">
        <div class="max-w-7xl mx-auto w-full">
            
            <div class="grid lg:grid-cols-12 gap-8 items-start">
                
                <div class="lg:col-span-6 z-10">
                    <h1 class="hero-title text-4xl md:text-[48px] font-bold leading-[1.2] text-[#0f172a] mb-8 tracking-tight">
                        Mengubah Air Limbah<br>
                        Menjadi <span class="text-blue-600 italic">Nilai Strategis</span>
                    </h1>
                    
                    <p class="text-[16px] md:text-xl text-slate-500 mb-8 leading-relaxed max-w-xl">
                        Air limbah menyimpan <span class="italic font-medium text-slate-700">untapped value</span> yang luar biasa. Melalui solusi <span class="font-semibold text-blue-600 underline underline-offset-4 decoration-blue-200">zero-CapEx</span> Invila™, kami mentransformasinya menjadi air bersih.
                    </p>
                </div>

                <div class="lg:col-span-6">
                    <div class="video-content overflow-hidden aspect-video bg-slate-900 relative shadow-2xl rounded-[24px] border-[3px] border-white">
                        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover">
                            <source src="kiw-industrial-project-video.mp4" type="video/mp4">
                        </video>
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded-md shadow-sm">
                            <p class="text-[8px] font-bold text-slate-800 uppercase tracking-widest">Site / Plant Video</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="logo-wrap">
                <div class="logo-header">
                    <span class="section-label">Dipercaya Industri & Mitra Strategis</span>
                </div>

                <div class="logo-grid">
                    <div class="logo-pill"><img src="cemerlang-samudra-kontrindo.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="kievit.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="kiw.png" alt="Logo"></div>
                    
                    <div class="logo-pill holding-pair"><img src="patria-maritim-perkasa.png" alt="Logo"></div>
                    <div class="logo-pill holding-pair"><img src="united-tractors.png" alt="Logo"></div>
                    
                    <div class="logo-pill"><img src="petrokimia-gresik.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="tirta-asasta-depok.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="tirtanadi.png" alt="Logo"></div>
                    <div class="logo-pill"><img src="wika.png" alt="Logo"></div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
